name: relatorios_em_pdf
description: App offline para RDP e Registro de Scrap - Lear Corporation
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Estado
  provider: ^6.1.2

  # Banco offline
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4

  # PDF
  pdf: ^3.11.1
  printing: ^5.13.3

  # Código de barras / câmera
  mobile_scanner: ^7.4.1

  # UI
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# Ícone do app: após `flutter pub get`, rode `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_background: "#E30613"
